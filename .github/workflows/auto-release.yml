name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: set tag name
        id: set_tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            # For manual testing, use a default tag or allow input
            echo "tag_name=test-release-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            # For tag pushes, use the actual tag name
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # For branch pushes, generate a version tag automatically
            # Get the latest tag and increment version
            latest_tag=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "v0.0.0")

            # Extract version components
            if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major=${BASH_REMATCH[1]}
              minor=${BASH_REMATCH[2]}
              patch=${BASH_REMATCH[3]}

              # Increment patch version until we find an unused tag
              new_patch=$((patch + 1))
              new_tag="v${major}.${minor}.${new_patch}"
              
              # Keep incrementing until we find a tag that doesn't exist
              while git ls-remote --tags origin "$new_tag" | grep -q "$new_tag" 2>/dev/null; do
                new_patch=$((new_patch + 1))
                new_tag="v${major}.${minor}.${new_patch}"
              done
            else
              # Fallback if version format is not recognized
              new_tag="v1.0.0"
              # Also check if fallback exists and increment if needed
              counter=0
              while git ls-remote --tags origin "$new_tag" | grep -q "$new_tag" 2>/dev/null; do
                counter=$((counter + 1))
                new_tag="v1.0.${counter}"
              done
            fi

            echo "tag_name=${new_tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: create and push tag
        if: github.event_name == 'push' && !contains(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          # Only create tag for branch pushes, not for existing tag pushes
          if [[ "${GITHUB_REF:-}" != refs/tags/* ]]; then
            tag_name="${{ steps.set_tag.outputs.tag_name }}"

            # Check if tag already exists locally and remotely
            if git rev-parse "$tag_name" >/dev/null 2>&1; then
              echo "Tag $tag_name already exists, skipping creation"
            elif git ls-remote --tags origin "$tag_name" | grep -q "$tag_name"; then
              echo "Tag $tag_name already exists remotely, skipping creation"
            else
              # Configure git user for tag creation
              git config user.name "GitHub Actions"
              git config user.email "actions@github.com"

              # Create annotated tag
              git tag -a "$tag_name" -m "Automated release $tag_name"

              # Push tag to repository
              git push origin "$tag_name"
            fi
          fi

      - name: generate release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail

          current_tag="${{ steps.set_tag.outputs.tag_name }}"

          previous_tag=$(git describe --tags --abbrev=0 --match 'v*' "${current_tag}^" 2>/dev/null || true)

          if [ -z "$previous_tag" ]; then
            range=""
          else
            range="${previous_tag}..${current_tag}"
          fi

          tmp_body_file="release_body.md"

          cat > "$tmp_body_file" << 'EOF'
          ## Instalação

          1. Baixe o `PTBR.zip` (ou o `PTBR-COM-PORTRAIT.zip`, que inclui retratos) no topo desta página.
          2. Extraia e copie a pasta `PTBR` para dentro da pasta `Package`, na raiz do jogo.
          3. Abra o jogo e escolha Português nas configurações.

          Guia completo na [página do projeto](https://github.com/isyuricunha/elin-portugues-brasileiro#como-instalar).

          ## Novidades nesta versão

          EOF

          if [ -z "$range" ]; then
            raw_log=$(git log --format='%H%x09%s')
          else
            raw_log=$(git log --format='%H%x09%s' "$range")
          fi

          tab=$(printf '\t')

          # Hide routine maintenance commits from the public release notes
          log_lines=$(printf '%s\n' "$raw_log" | grep -viE "${tab}([a-z]+\((ci|ci-runners)\)[:(]|(ci|chore|docs|build|test)[:(])" || true)

          if [ -z "$log_lines" ]; then
            echo "- Nenhuma mudança registrada nesta versão." >> "$tmp_body_file"
          else
            while IFS=$'\t' read -r sha subject; do
              short_sha=$(echo "$sha" | cut -c1-7)
              url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${sha}"
              echo "- ${subject} ([${short_sha}](${url}))" >> "$tmp_body_file"
            done <<< "$log_lines"
          fi

          cat >> "$tmp_body_file" << 'EOF'

          ## Apoie o projeto!

          <p align="center">

          ![APOIE O PROJETO!](https://i.pinimg.com/736x/c3/2f/7f/c32f7f205519e96b5e9c4b18362ddddb.jpg)

          </p>

          Se o projeto te ajuda, você pode me apoiar via Pix: `pix@yuricunha.com`, ou pelo QR Code:

          <p align="center">

          ![QR Code Pix](https://i.imgur.com/jx1MAIO.png)

          </p>

          É o jeito de mostrar que você quer que eu continue trabalhando neste projeto por muitos anos, ou enquanto o jogo for atualizado.

          Cuide-se! 🍻
          EOF

          echo "body_file=${tmp_body_file}" >> "$GITHUB_OUTPUT"

      - name: create github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          current_tag="${{ steps.set_tag.outputs.tag_name }}"
          title="Release ${current_tag}"

          shopt -s nullglob
          assets=( *.zip *.7zip *.7z )

          if gh release view "$current_tag" >/dev/null 2>&1; then
            gh release edit "$current_tag" --title "$title" --notes-file "${{ steps.release_notes.outputs.body_file }}"
            if [ ${#assets[@]} -gt 0 ]; then
              gh release upload "$current_tag" "${assets[@]}" --clobber
            fi
          else
            if [ ${#assets[@]} -gt 0 ]; then
              gh release create "$current_tag" "${assets[@]}" --title "$title" --notes-file "${{ steps.release_notes.outputs.body_file }}"
            else
              gh release create "$current_tag" --title "$title" --notes-file "${{ steps.release_notes.outputs.body_file }}"
            fi
          fi
